name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (core + wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build wasm package
        run: wasm-pack build crates/isopleth-wasm --target web --release --out-dir ../../packages/wasm/pkg --out-name isopleth_wasm && node scripts/fix-wasm-pkg.mjs && ls -la packages/wasm/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: isopleth-wasm
          path: packages/wasm/pkg
      - name: Publish the prebuilt wasm to the wasm-pkg branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd packages/wasm/pkg
          git init -q -b wasm-pkg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "wasm build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" wasm-pkg

  typescript:
    name: TypeScript (library, js backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w isopleth
      - run: npm test -w isopleth
      - run: npm run build -w isopleth

  typescript-wasm:
    name: TypeScript tests on the wasm backend + demo build
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: isopleth-wasm
          path: packages/wasm/pkg
      - run: npm ci
      - run: ISOPLETH_BACKEND=wasm npm test -w isopleth
      - run: npm run build -w isopleth
      - run: npm run build -w @isopleth/demo
