name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (core + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build wasm package
        run: wasm-pack build crates/isopleth-wasm --target web --release --out-dir ../../packages/wasm/pkg --out-name isopleth_wasm && node scripts/fix-wasm-pkg.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: isopleth-wasm
          path: packages/wasm/pkg

  typescript:
    name: TypeScript (library + demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w isopleth
      - run: npm test -w isopleth
      - run: npm run build -w isopleth
      - run: npm run build -w @isopleth/demo
