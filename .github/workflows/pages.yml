name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled for this repository
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::The site was built but not deployed. Enable Pages once under Settings → Pages → Source: GitHub Actions (https://github.com/${{ github.repository }}/settings/pages); it deploys on the next push to main or by re-running this workflow."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the prebuilt wasm from the wasm-pkg branch (built by CI)
        run: |
          mkdir -p packages/wasm/pkg
          if git ls-remote --exit-code --heads origin wasm-pkg >/dev/null 2>&1; then
            git fetch -q origin wasm-pkg && git archive origin/wasm-pkg | tar -x -C packages/wasm/pkg
          fi
          ls packages/wasm/pkg || true
      - run: BASE_PATH=/isopleth/ npm run build -w @isopleth/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/demo/dist

  deploy:
    needs: build
    # Deploying to a repository without Pages enabled fails with a 404, so skip
    # (with a warning from the build job) until it has been switched on once.
    if: needs.build.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
