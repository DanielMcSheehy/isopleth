name: Release

# Publishes `@danielmcsheehy/isopleth` and `@danielmcsheehy/isopleth-wasm` when a version tag is pushed:
#   npm version minor -w @danielmcsheehy/isopleth
#   npm version minor -w @danielmcsheehy/isopleth-wasm --no-git-tag-version
#   git tag v0.2.0 && git push --tags
# Both packages must carry the tag's version, and the library's optional wasm
# dependency must match. Auth is npm trusted publishing (OIDC, no secret).
# After the first manual publish, bind this workflow once:
#   npm trust github @danielmcsheehy/isopleth --repo DanielMcSheehy/isopleth --file release.yml --allow-publish -y
#   npm trust github @danielmcsheehy/isopleth-wasm --repo DanielMcSheehy/isopleth --file release.yml --allow-publish -y

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5
      - run: npm ci
      - name: Check that the tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in packages/isopleth/package.json packages/wasm/package.json; do
            V=$(node -p "require('./$p').version")
            [ "$V" = "$TAG" ] || { echo "$p is $V but tag is $TAG"; exit 1; }
          done
          DEP=$(node -p "require('./packages/isopleth/package.json').optionalDependencies['@danielmcsheehy/isopleth-wasm']")
          [ "$DEP" = "$TAG" ] || { echo "optional wasm dep is $DEP but tag is $TAG"; exit 1; }
      - run: cargo test --workspace
      - name: Build wasm
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          npm run build:wasm
      - run: npm run typecheck -w @danielmcsheehy/isopleth && npm test -w @danielmcsheehy/isopleth && ISOPLETH_BACKEND=wasm npm test -w @danielmcsheehy/isopleth
      - run: npm run build -w @danielmcsheehy/isopleth
      - name: Publish isopleth-wasm
        run: npm publish --access public -w @danielmcsheehy/isopleth-wasm
      - name: Publish isopleth
        run: npm publish --access public -w @danielmcsheehy/isopleth
